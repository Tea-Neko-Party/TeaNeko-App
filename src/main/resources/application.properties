# ----- spring framework config -----
spring.application.name=TeaNeko-App
app.version=${version:unknown}
spring.profiles.active=${springProfile:dev}
server.port=6691

# ----- sql config -----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.threads.virtual.enabled=true

# ----- timer config -----
tea-neko.timer.update-delay-ms=10
tea-neko.cache.general-clean-rate-ms=1000

# ----- bot config -----
tea-neko.bot.default-name=TeaNeko

# ----- other config -----
tea-neko.database.max-retry-count=8

# Agent 会话排队：等待数量不包含已占运行槽的请求，时限覆盖启动前的调度等待。
tea-neko.agent.queue.max-waiting-requests=5
tea-neko.agent.queue.timeout-seconds=30
# 内存会话最多保留一千个，空闲三十分钟后惰性失效；不删除长期记忆或持久化历史。
tea-neko.agent.conversation.max-conversations=1000
tea-neko.agent.conversation.idle-ttl-seconds=1800
# 完整轮次窗口和统一协议 JSON 输入上限，scope 可覆盖前两项；重放不自动重发业务。
tea-neko.agent.conversation.max-history-messages=40
tea-neko.agent.conversation.max-input-bytes=262144
tea-neko.agent.conversation.max-completed-requests=32
tea-neko.agent.conversation.max-replay-bytes=1048576
# 每个 TeaNeko 用户最多持有的活动自建记忆空间；默认共享空间不占个人配额。
tea-neko.agent.memory.max-created-namespaces=5
# Recall 的证据数组按紧凑 JSON 字符计量；检查预算包含过期和未命中的原记录。
tea-neko.agent.memory.recall.injection-limit=12
tea-neko.agent.memory.recall.tool-limit=8
tea-neko.agent.memory.recall.hard-limit=20
tea-neko.agent.memory.recall.max-characters=16000
tea-neko.agent.memory.recall.max-scanned=1000
