# ----- spring framework config -----
spring.application.name=TeaNeko-App
app.version=${version:unknown}
spring.profiles.active=${springProfile:dev}
server.port=6691

# ----- sql config -----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.threads.virtual.enabled=true

# ----- timer config -----
tea-neko.timer.update-delay-ms=10
tea-neko.cache.general-clean-rate-ms=1000

# ----- bot config -----
tea-neko.bot.default-name=TeaNeko

# ----- other config -----
tea-neko.database.max-retry-count=8

# Agent 会话排队：等待数量不包含已占运行槽的请求，时限覆盖启动前的调度等待。
tea-neko.agent.queue.max-waiting-requests=5
tea-neko.agent.queue.timeout-seconds=30
# 内存会话最多保留一千个，空闲三十分钟后惰性失效；不删除长期记忆或持久化历史。
tea-neko.agent.conversation.max-conversations=1000
tea-neko.agent.conversation.idle-ttl-seconds=1800
# 完整轮次窗口和统一协议 JSON 输入上限，scope 可覆盖前两项；重放不自动重发业务。
tea-neko.agent.conversation.max-history-messages=40
tea-neko.agent.conversation.max-input-bytes=262144
tea-neko.agent.conversation.max-completed-requests=32
tea-neko.agent.conversation.max-replay-bytes=1048576
# 每个 TeaNeko 用户最多持有的活动自建记忆空间；默认共享空间不占个人配额。
tea-neko.agent.memory.max-created-namespaces=5
# DEBUG 编辑及克隆使用完整有界快照；超限整批拒绝，不生成截断克隆，非法值仅使该管理操作失败。
tea-neko.agent.memory.management.max-records=1000
tea-neko.agent.memory.management.max-bytes=1048576
# Recall 的证据数组按紧凑 JSON 字符计量；检查预算包含过期和未命中的原记录。
tea-neko.agent.memory.recall.injection-limit=12
tea-neko.agent.memory.recall.tool-limit=8
tea-neko.agent.memory.recall.hard-limit=20
# 单次检索证据数组的紧凑 JSON 字符上限，含元数据与转义，不是 token 数。
tea-neko.agent.memory.recall.max-characters=16000
# 单次最多检查的候选记录数，包含过期和未命中记录，不等于返回条数。
tea-neko.agent.memory.recall.max-scanned=1000

# 文本历史独立于长期事实；清理每次最多一百行，过期记录立即停止查询。
tea-neko.agent.history.retention-days=7
tea-neko.agent.history.cleanup-interval-ms=60000

# 后台摘要使用独立交互预算；保留最近完整轮次，不自动生成长期个人事实。
tea-neko.agent.summary.trigger-turns=12
tea-neko.agent.summary.keep-turns=4
tea-neko.agent.summary.trigger-bytes=32768
tea-neko.agent.summary.max-input-bytes=131072
tea-neko.agent.summary.max-characters=4000
tea-neko.agent.summary.max-model-calls=1
tea-neko.agent.summary.max-total-tokens=16384
tea-neko.agent.summary.timeout-seconds=45
tea-neko.agent.summary.cooldown-seconds=60

# 人格学习只处理真实成功互动；应用补正与学习开关独立，不生成用户画像。
tea-neko.agent.personality-learning.enabled=true
tea-neko.agent.personality-learning.cooldown-seconds=300
tea-neko.agent.personality-learning.timeout-seconds=45
tea-neko.agent.personality-learning.max-model-calls=1
tea-neko.agent.personality-learning.max-total-tokens=16384
tea-neko.agent.personality-learning.max-input-bytes=131072
tea-neko.agent.personality-learning.retention-days=30
# Skill 只加载本地流程描述，作用域还需显式开启并选择名称。
tea-neko.agent.skills.enabled=true
tea-neko.agent.skills.directory=config/agent/skills
tea-neko.agent.skills.builtin-example=true

# 脱敏用量告警在异步监控域运行；按 scope/实例冷却，不自动发送聊天通知。
# 关闭仅停止阈值告警，仍保留脱敏轮次统计。
tea-neko.agent.monitor.alerts-enabled=true
tea-neko.agent.monitor.alert-tokens=16384
# 同 scope/实例五分钟内不重复告警，期间只合并次数；单位为秒。
tea-neko.agent.monitor.alert-cooldown-seconds=300
