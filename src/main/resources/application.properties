# ----- spring framework config -----
spring.application.name=TeaNeko-App
app.version=${version:unknown}
spring.profiles.active=${springProfile:dev}
server.port=6691

# ----- sql config -----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.threads.virtual.enabled=true

# ----- timer config -----
tea-neko.timer.update-delay-ms=10
tea-neko.cache.general-clean-rate-ms=1000

# ----- bot config -----
tea-neko.bot.default-name=TeaNeko

# ----- other config -----
tea-neko.database.max-retry-count=8

# Agent 会话排队：等待数量不包含已占运行槽的请求，时限覆盖启动前的调度等待。
tea-neko.agent.queue.max-waiting-requests=5
tea-neko.agent.queue.timeout-seconds=30
# 内存会话最多保留一千个，空闲三十分钟后惰性失效；不删除长期记忆或持久化历史。
tea-neko.agent.conversation.max-conversations=1000
tea-neko.agent.conversation.idle-ttl-seconds=1800
