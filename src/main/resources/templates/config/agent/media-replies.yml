# 媒体表达与素材采集分别管理；关闭采集后仍可使用已有图库。
enabled: true
max-per-reply: 2
max-categories: 2
# 按本功能已准入的对话尝试计轮次；不是按机器人自己展示次数计热度。
cooldown-turns: 3
# 必须完整提供某类全部当前可用项，超过此预算返回 complete=false。
max-category-characters: 7800
# 2026/11/05：省略 native-faces 时由客户端提供默认目录；按 client 配置时每个目录最多64项。
# 显式 native-faces: {} 保持原禁用行为；配置 onebot: {} 也会关闭该客户端目录。
# native-faces:
#   onebot:
#     '14': 微笑
