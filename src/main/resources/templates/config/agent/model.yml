---
# 默认路由、模型参数、凭据、连接与 metadata 统一在本文件配置。
# 必须为选定路由填写实际模型名；空列表不会自动回退到代码中的模型名。
# 调用参数、凭据、连接和 metadata 统一放在同一条模型配置中。
# Core YAML 解析器支持 ${变量名} 和 ${变量名:默认值}；字符串占位符建议加引号。
# 空默认值允许未使用的供应商先不配置密钥，实际调用时才检查所选供应商。
default-model-id: "${LLM_DEFAULT_MODEL_ID:}"
models: []

