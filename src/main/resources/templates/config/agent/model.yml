---
# 模型参数配置；默认路由在 config/agent/main-config.yml 的 default-model-id 中选择。
# 必须为选定路由填写实际模型名；空列表不会自动回退到代码中的模型名。
# 密钥及连接覆盖只放在 Spring Boot application 配置中，不能写在本文件。
# 详见 src/main/java/org/zexnocs/teanekoagent/llm/file_config/README.md 的迁移说明。
models: []

# 示例（模型名是占位符，请替换）：
