# 2026/11/05：默认启用本机 Web 控制台；生产部署须修改为正式 HTTPS 来源及实际代理地址。
enabled: true
public-origin: 'https://localhost:5173'
# 空值时每次启动生成一次，保存在受限 data/web/runtime-admin-token，并通过后端启动日志提示。
admin-token: '${TEANEKO_WEB_ADMIN_TOKEN:}'
idle-minutes: 30
absolute-hours: 8
# 仅信任明确代理，代理必须覆盖转发协议/主机头；不要填任意来源。
# 2026/11/05：信任默认仅绑定本机的 Vite 开发代理；生产部署按实际代理地址修改。
trusted-proxies: ['127.0.0.1']
# 开启 Web 后，机器 /ws/{client} 入口要求独立 Bearer 凭据，不能复用管理员令牌。
# machine-tokens:
#   onebot: '${TEANEKO_ONEBOT_ACCESS_TOKEN}'
machine-tokens: {}
# 2026/11/04：管理员直接编辑适用且已启用的聊天配置，无需 settings-sections/settings-groups 白名单。
# 只开放声明管理来源的注册方法；旧配置需本机明确补充后重载。
console-prefixes: ['/console']
# 2026/11/03：只公开这些已注册文件表单，不开放认证根配置或任意路径。
file-sections: ['agent.main', 'agent.models', 'agent.personality', 'agent.expression', 'agent.stickers', 'agent.media', 'onebot.main', 'web.chat']
# 2026/11/03：只向当前管理员开放列出的类型化管理资源。
management-resources:
  - 'teaneko.agent:activity'
  - 'teaneko.agent:memory'
  - 'teaneko.agent:profiles'
  - 'teaneko.agent:personality'
  - 'teaneko.agent:layers'
  - 'teaneko.agent:schedules'
  - 'teaneko.core:runtime'
  - 'teaneko.core:logs'
